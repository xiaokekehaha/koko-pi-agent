[project]
name = "koko-pi-agent"
version = "0.2.0"
description = "A terminal AI coding assistant"
requires-python = ">=3.11"
dependencies = [
    "textual>=2.1.0",
    "anthropic>=0.47.0",
    "openai>=1.60.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "mcp>=1.12.0",
    "httpx[socks]>=0.27.0",
    "websockets>=14.0",
]

[project.scripts]
koko = "koko_pi_agent.__main__:main"
koko_pi_agent = "koko_pi_agent.__main__:main"
mewcode = "koko_pi_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["koko_pi_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
